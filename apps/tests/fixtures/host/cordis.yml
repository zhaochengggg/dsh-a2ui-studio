- name: '@deepseek-ai/dsh-llm'
- name: '@deepseek-ai/dsh-session'
- name: '@deepseek-ai/dsh-session-projection'
- name: '@deepseek-ai/dsh-system-prompt'
- name: '@deepseek-ai/dsh-tools'
- name: '@deepseek-ai/dsh-skill'
- name: '@deepseek-ai/dsh-agent'
- name: '@deepseek-ai/dsh-agent-loop'
  config:
    agents: []
- name: '@deepseek-ai/dsh-subprocess-local'
- name: '@deepseek-ai/dsh-user-questions'
- name: 'dsh-control-studio/machines'
  config:
    root: !!js process.env.DSH_APP_CARDS_EXAMPLE_ROOT + '/catalog/machines'
    sshDir: !!js process.env.DSH_APP_CARDS_EXAMPLE_ROOT + '/ssh'
- name: '@deepseek-ai/dsh-app-cards'
  config:
    dataPath: !!js process.env.DSH_APP_CARDS_EXAMPLE_ROOT + '/applications'
    hostRoots:
      - !!js process.env.DSH_APP_CARDS_EXAMPLE_ROOT
    executionTimeoutMs: 5000
    outputLimitBytes: 4096
    graceMs: 100
    agentProvider: fixture
    agentModel: fixture
